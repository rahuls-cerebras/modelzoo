trainer:
  init:
    model_dir: ./model_dir
    seed: 1
    model:
      name: gpt2
      vocab_size: 50257
      hidden_size: 128
      position_embedding_type: learned
      share_embedding_weights: true
      max_position_embeddings: 128
      num_hidden_layers: 2
      dropout_rate: 0.1
      layer_norm_epsilon: 1.0e-05
      num_heads: 2
      attention_type: scaled_dot_product
      attention_dropout_rate: 0.1
      use_projection_bias_in_attention: true
      use_ffn_bias_in_attention: true
      filter_size: 512
      nonlinearity: gelu
      use_ffn_bias: true
      use_bias_in_output: false
      loss_scaling: num_tokens
      loss_weight: 1.0
    optimizer:
      AdamW:
        correct_bias: true
        weight_decay: 0.01
    schedulers:
    - SequentialLR:
        schedulers:
        - LinearLR:
            initial_learning_rate: 0.0
            end_learning_rate: 0.0001
            total_iters: 100
        - LinearLR:
            initial_learning_rate: 0.0001
            end_learning_rate: 0.0
            total_iters: 9900
    precision:
      enabled: true
      fp16_type: cbfloat16
      loss_scaling_factor: dynamic
    loop:
      num_steps: 10000
    checkpoint:
      steps: 10000
    logging:
      log_steps: 10
    backend:
      backend_type: CSX
      cluster_config:
        mgmt_namespace : "sota-miq"
        job_priority : "p1"
        max_wgt_servers : 1
        num_workers_per_csx : 1
        max_act_per_csx : 1
        job_time_sec : 2000
        disable_version_check : True    
  fit:
    train_dataloader: &id002
      data_processor: GptNpyRLDataProcessor
      batch_size: 16
      num_workers: 8
      prefetch_factor: 10
      persistent_workers: true   
  validate:
    val_dataloader: &id001
      data_processor: GptInferenceSyntheticDataProcessor
      max_sequence_length: 128
      num_examples: 1000
      vocab_size: 50257
      shuffle: false
      shuffle_seed: 1
      n_responses: 4
      num_workers: 8
      prefetch_factor: 10
      persistent_workers: true
      start_token: 111
